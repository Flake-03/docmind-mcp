[project]
name = "docmind-mcp"
version = "0.1.0"
requires-python = ">=3.11,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastmcp = "^4.0.11"
filelock = "^4.0.11"
httpx = "^0.28.1"
mcp = "^2.3.0"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
uvicorn = "^0.54.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
